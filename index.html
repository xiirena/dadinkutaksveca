<!DOCTYPE html>
<html lang="sr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dadin Kutak Sveća</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{

background:
linear-gradient(
180deg,
#130018,
#2b0738,
#160018
);

overflow-x:hidden;
color:white;
min-height:100vh;
}


/* GLOW */

.glow{

position:fixed;

width:600px;
height:600px;

background:#ffb347;

filter:blur(180px);

opacity:.18;

border-radius:50%;

animation:move 10s infinite alternate;

z-index:-2;
}

@keyframes move{

to{

transform:
translateX(300px)
translateY(200px);

}

}


/* SVECE */

.candle{

position:fixed;

font-size:60px;

opacity:.05;

animation:float 15s linear infinite;

}

@keyframes float{

0%{
transform:
translateY(120vh);
}

100%{

transform:
translateY(-200px);

}

}


/* CVECE */

.flower{

position:fixed;

font-size:40px;

opacity:.05;

animation:spin 20s linear infinite;

}

@keyframes spin{

100%{

transform:
rotate(360deg);

}

}


/* JEZICI */

.languages{

position:absolute;

right:20px;
top:20px;

display:flex;

gap:10px;
}

.languages button{

padding:10px 16px;

border:none;

border-radius:20px;

background:#ffffff15;

color:white;

cursor:pointer;

transition:.3s;
}

.languages button:hover{

background:#ffb347;

transform:scale(1.1);

}



/* HEADER */

header{

padding:70px 20px;

text-align:center;
}

h1{

font-family:"Great Vibes";

font-size:90px;

color:#ffd08a;

text-shadow:
0 0 20px orange,
0 0 40px gold;

}

.subtitle{

font-size:20px;

opacity:.8;
}



/* DELIVERY */

.delivery{

text-align:center;

margin:25px;

font-size:22px;

color:#ffd08a;

}



/* PRODUCTS */

.products{

display:flex;

justify-content:center;

gap:35px;

flex-wrap:wrap;

padding:40px;

}

.card{

width:250px;

background:#ffffff08;

padding:18px;

border-radius:25px;

backdrop-filter:blur(10px);

transition:.4s;
}

.card:hover{

transform:
translateY(-10px)
scale(1.03);

box-shadow:
0 0 30px orange;

}

.card img{

width:100%;
height:220px;

background:#333;

object-fit:cover;

border-radius:20px;
}

.price{

font-size:24px;

font-weight:bold;

margin-top:10px;

color:#ffd08a;
}



/* SOCIAL */

.social{

padding:60px;

text-align:center;
}

.social h2{

font-family:"Great Vibes";

font-size:55px;

margin-bottom:25px;
}

.links{

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;
}

.links a{

text-decoration:none;

color:white;

padding:15px 25px;

background:#ffffff10;

border-radius:30px;

transition:.3s;
}

.links a:hover{

background:#ffb347;

transform:scale(1.1);

}



footer{

padding:50px;

text-align:center;

opacity:.7;
}

</style>

</head>

<body>



<div class="glow"></div>


<div class="candle" style="left:5%">🕯️</div>
<div class="candle" style="left:20%">🕯️</div>
<div class="candle" style="left:40%">🕯️</div>
<div class="candle" style="left:60%">🕯️</div>
<div class="candle" style="left:85%">🕯️</div>


<div class="flower" style="left:10%;top:20%">🌸</div>
<div class="flower" style="right:10%;top:35%">🌷</div>
<div class="flower" style="left:80%;bottom:20%">🌹</div>



<div class="languages">

<button onclick="lang('sr')">RS</button>
<button onclick="lang('en')">EN</button>
<button onclick="lang('ru')">RU</button>

</div>



<header>

<h1 id="title">

Dadin Kutak Sveća

</h1>

<p class="subtitle" id="subtitle">

Ručno pravljene sveće ✨

</p>

</header>



<div class="delivery" id="delivery">

🚚 Samo lično dostavljanje

</div>




<section class="products">


<div class="card">

<img src="krigla.jpg">

<h2>Krigla</h2>

<div class="price">

350 din

</div>

</div>



<div class="card">

<img src="casice.jpg">

<h2>Čašice</h2>

<div class="price">

250 din

</div>

</div>



<div class="card">

<img src="medice.jpg">

<h2>Medice</h2>

<div class="price">

150 din

</div>

</div>



<div class="card">

<img src="male.jpg">

<h2>Male</h2>

<div class="price">

100 din

</div>

</div>


</section>




<section class="social">

<h2>

Poručivanje

</h2>


<div class="links">

<a href="">📷 Instagram</a>

<a href="">📘 Facebook</a>

<a href="">🎵 TikTok</a>

<a href="">💌 Inbox</a>

</div>

</section>



<footer>

🕯️ Dadin Kutak Sveća

</footer>




<script>

const texts={

sr:{
title:"Dadin Kutak Sveća",
subtitle:"Ručno pravljene sveće ✨",
delivery:"🚚 Samo lično dostavljanje"
},

en:{
title:"Dado's Candle Corner",
subtitle:"Handmade candles ✨",
delivery:"🚚 Personal delivery only"
},

ru:{
title:"Уголок свечей Дади",
subtitle:"Свечи ручной работы ✨",
delivery:"🚚 Только личная доставка"
}

};


function lang(language){

document.getElementById("title").textContent=
texts[language].title;

document.getElementById("subtitle").textContent=
texts[language].subtitle;

document.getElementById("delivery").textContent=
texts[language].delivery;

}

</script>



</body>
</html>
