<!DOCTYPE html>
<html lang="sr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dadin Kutak Sveća</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:
linear-gradient(
180deg,
#120014,
#2f0938,
#140016
);

overflow-x:hidden;
color:white;
min-height:100vh;
}


/* GLOW */

.glow{
position:fixed;
width:500px;
height:500px;
background:#ffb347;
filter:blur(180px);
opacity:.18;
border-radius:50%;
animation:move 8s infinite alternate;
z-index:-2;
}

@keyframes move{

to{

transform:
translateX(350px)
translateY(120px);

}

}


/* POZADINSKE SVECE */

.candle{
position:fixed;
font-size:60px;
opacity:.06;
animation:float 15s linear infinite;
}

.c1{left:5%;}
.c2{left:25%;}
.c3{left:50%;}
.c4{left:80%;}

@keyframes float{

0%{
transform:translateY(120vh);
}

100%{
transform:translateY(-150px);
}

}


/* CVECE */

.flower{
position:fixed;
font-size:40px;
opacity:.05;
animation:spin 20s linear infinite;
}

.f1{
left:10%;
top:20%;
}

.f2{
right:5%;
bottom:15%;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}


/* LANGUAGE */

.languages{

position:absolute;
top:20px;
right:20px;

display:flex;
gap:10px;

}

.languages button{

border:none;
padding:10px 18px;

border-radius:20px;

background:#ffffff15;
color:white;

cursor:pointer;

transition:.3s;
}

.languages button:hover{

background:#ffb347;
transform:scale(1.1);

}


/* HEADER */

header{

padding:70px 20px;
text-align:center;

}

h1{

font-family:"Great Vibes";

font-size:90px;

color:#ffd08a;

text-shadow:
0 0 20px orange,
0 0 40px gold;

animation:flicker 2s infinite;
}

@keyframes flicker{

50%{
opacity:.85;
}

}

.subtitle{

margin-top:10px;
font-size:20px;
opacity:.8;
}


/* DELIVERY */

.delivery{

text-align:center;
font-size:22px;
color:#ffd08a;
margin-bottom:30px;

}


/* PRODUCTS */

.products{

display:flex;
justify-content:center;
flex-wrap:wrap;

gap:35px;

padding:40px;

}

.card{

width:250px;

background:rgba(255,255,255,.06);

padding:18px;

border-radius:25px;

backdrop-filter:blur(10px);

transition:.4s;

}

.card:hover{

transform:
translateY(-10px)
scale(1.03);

box-shadow:
0 0 30px orange;

}

.card img{

width:100%;
height:220px;

object-fit:cover;

border-radius:20px;

background:#333;
}

.card h2{

margin-top:15px;
font-size:28px;

}

.price{

font-size:24px;
font-weight:bold;

margin-top:8px;

color:#ffd08a;
}


/* SOCIAL */

.socials{

text-align:center;
padding:60px 20px;

}

.socials h2{

font-family:"Great Vibes";

font-size:55px;

margin-bottom:25px;
}

.links{

display:flex;
justify-content:center;

gap:20px;

flex-wrap:wrap;
}

.links a{

text-decoration:none;
color:white;

padding:15px 25px;

background:#ffffff10;

border-radius:30px;

transition:.3s;
}

.links a:hover{

background:#ffb347;
transform:scale(1.1);
}


/* FOOTER */

footer{

text-align:center;
padding:50px;

opacity:.7;

}

</style>

</head>

<body>


<div class="glow"></div>

<div class="candle c1">🕯️</div>
<div class="candle c2">🕯️</div>
<div class="candle c3">🕯️</div>
<div class="candle c4">🕯️</div>

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>



<div class="languages">

<button onclick="lang('sr')">RS</button>
<button onclick="lang('en')">EN</button>
<button onclick="lang('ru')">RU</button>

</div>



<header>

<h1 id="title">

Dadin Kutak Sveća

</h1>

<p class="subtitle" id="subtitle">

Ručno pravljene sveće ✨

</p>

</header>



<div class="delivery" id="delivery">

🚚 Samo lično dostavljanje

</div>



<section class="products">


<div class="card">

<img src="krigla.jpg">

<h2>Krigla</h2>

<div class="price">

350 din

</div>

</div>



<div class="card">

<img src="casice.jpg">

<h2>Čašice</h2>

<div class="price">

250 din

</div>

</div>



<div class="card">

<img src="medice.jpg">

<h2>Medice</h2>

<div class="price">

150 din

</div>

</div>



<div class="card">

<img src="male.jpg">

<h2>Male</h2>

<div class="price">

100 din

</div>

</div>


</section>



<section class="socials">

<h2>

Poručivanje

</h2>


<div class="links">

<a href="">📷 Instagram</a>

<a href="">📘 Facebook</a>

<a href="">🎵 TikTok</a>

<a href="">💌 Inbox</a>

</div>

</section>



<footer>

🕯️ Dadin Kutak Sveća

</footer>



<script>

const texts={

sr:[
"Dadin Kutak Sveća",
"Ručno pravljene sveće ✨",
"🚚 Samo lično dostavljanje"
],

en:[
"Dado's Candle Corner",
"Handmade candles ✨",
"🚚 Personal delivery only"
],

ru:[
"Уголок свечей Дади",
"Свечи ручной работы ✨",
"🚚 Только личная доставка"
]

}


function lang(l){

document.getElementById("title").innerHTML=
texts[l][0]

document.getElementById("subtitle").innerHTML=
texts[l][1]

document.getElementById("delivery").innerHTML=
texts[l][2]

}

</script>

</body>
</html>
