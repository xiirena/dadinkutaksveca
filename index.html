<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dadin Kutak Sveća</title>

<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{

background:
linear-gradient(
180deg,
#130018,
#2d1038,
#150018
);

color:white;
overflow-x:hidden;
min-height:100vh;
}


/* Glow */

.glow{
position:fixed;
width:350px;
height:350px;
background:#ffb347;
filter:blur(120px);
opacity:.18;
border-radius:50%;
animation:move 8s infinite alternate;
z-index:-1;
}

@keyframes move{
to{
transform:
translateX(300px)
translateY(100px);
}
}


header{

padding:40px;
text-align:center;
}


h1{

font-family:"Marck Script";
font-size:75px;

color:#ffd08a;

text-shadow:
0 0 20px orange,
0 0 40px gold;

animation:flicker 2s infinite;
}


@keyframes flicker{

50%{
opacity:.85;
}
}


.subtitle{

font-size:18px;
opacity:.8;
margin-top:10px;
}


/* Language buttons */

.languages{

position:absolute;
right:20px;
top:20px;
display:flex;
gap:10px;
}


.languages button{

border:none;
padding:10px 16px;
border-radius:20px;

background:#ffffff15;
color:white;
cursor:pointer;

transition:.3s;
}

.languages button:hover{

background:#ffb347;
transform:scale(1.1);
}


/* Products */

.products{

display:flex;
justify-content:center;
gap:35px;

flex-wrap:wrap;

padding:40px;
}


.card{

background:rgba(255,255,255,.06);

width:250px;

padding:18px;

border-radius:25px;

backdrop-filter:blur(10px);

transition:.4s;
}


.card:hover{

transform:
translateY(-10px)
scale(1.03);

box-shadow:
0 0 30px orange;
}


.card img{

width:100%;
height:220px;

object-fit:cover;

border-radius:20px;

background:#333;
}


.card h2{

margin-top:15px;
font-size:26px;
}


.price{

margin-top:8px;

font-size:22px;

color:#ffd08a;
font-weight:bold;
}


footer{

padding:50px;
text-align:center;
opacity:.7;
}


</style>
</head>

<body>

<div class="glow"></div>

<div class="languages">

<button onclick="changeLang('sr')">
RS
</button>

<button onclick="changeLang('en')">
EN
</button>

<button onclick="changeLang('ru')">
RU
</button>

</div>


<header>

<h1 id="title">
Dadin Kutak Sveća
</h1>

<p class="subtitle" id="subtitle">

Ručno pravljene sveće ✨

</p>

</header>



<section class="products">

<div class="card">

<img src="krigla.jpg">

<h2>Krigla</h2>

<div class="price">
350 din
</div>

</div>



<div class="card">

<img src="casice.jpg">

<h2>Čašice</h2>

<div class="price">

200 din

</div>

</div>



<div class="card">

<img src="medice.jpg">

<h2>Medice</h2>

<div class="price">

150 din

</div>

</div>



<div class="card">

<img src="male.jpg">

<h2>Male</h2>

<div class="price">

100 din

</div>

</div>

</section>



<footer>

🕯️ Dadin Kutak Sveća

</footer>



<script>

const text={

sr:[
"Dadin Kutak Sveća",
"Ručno pravljene sveće ✨"
],

en:[
"Dado's Candle Corner",
"Handmade candles ✨"
],

ru:[
"Уголок свечей Дади",
"Свечи ручной работы ✨"
]

};


function changeLang(lang){

document.getElementById("title")
.innerHTML=text[lang][0];

document.getElementById("subtitle")
.innerHTML=text[lang][1];

}

</script>

</body>
</html>
