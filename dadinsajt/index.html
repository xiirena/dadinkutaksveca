<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">

<title>Dadin Kutak Sveća</title>

<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:
linear-gradient(180deg,#1a0022,#2d1038,#120018);
color:white;
overflow-x:hidden;
}


/* POZADINSKE SVEĆE */

.candle{
position:fixed;
bottom:0;
width:35px;
height:120px;
background:#fff0d5;
border-radius:10px;
opacity:.2;
}

.flame{
position:absolute;
top:-20px;
left:10px;

width:15px;
height:25px;

background:orange;

border-radius:50% 50% 50% 50%;

filter:blur(1px);

animation:
burn 1s infinite alternate;
}

@keyframes burn{

from{
transform:
scale(1)
rotate(-5deg);
}

to{
transform:
scale(1.2)
rotate(5deg);
}

}


/* cvece */

.flower{
position:fixed;
font-size:35px;
opacity:.12;
animation:
float 12s infinite linear;
}

@keyframes float{

from{
transform:
translateY(100vh);
}

to{
transform:
translateY(-120vh);
}

}


h1{

font-family:
Marck Script;

font-size:80px;

text-align:center;

margin-top:40px;

color:#ffd08a;

text-shadow:
0 0 30px orange;
}


.subtitle{

text-align:center;
opacity:.8;
font-size:18px;
}


.notice{

text-align:center;

background:#ffffff10;

padding:15px;

margin:30px auto;

width:300px;

border-radius:20px;

font-weight:bold;
}


.products{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:30px;

padding:40px;
}


.card{

width:250px;

background:#ffffff10;

border-radius:25px;

padding:20px;

transition:.3s;
}


.card:hover{

transform:
translateY(-8px);

box-shadow:
0 0 30px orange;
}


.card img{

width:100%;
height:200px;

object-fit:cover;

border-radius:20px;
}


.price{

color:#ffd08a;

font-size:24px;

font-weight:bold;
}


/* SOCIALS */

.socials{

text-align:center;

padding:40px;
}


.socials a{

display:inline-block;

margin:10px;

padding:14px 22px;

background:#ffffff15;

border-radius:20px;

text-decoration:none;

color:white;

transition:.3s;
}


.socials a:hover{

background:#ffb347;

transform:scale(1.1);
}


footer{

padding:30px;

text-align:center;

opacity:.7;
}

</style>
</head>

<body>


<div class="flower" style="left:5%">🌸</div>
<div class="flower" style="left:20%">🌺</div>
<div class="flower" style="left:75%">🌷</div>
<div class="flower" style="left:90%">🌹</div>

<div class="candle" style="left:10%">
<div class="flame"></div>
</div>

<div class="candle" style="left:85%">
<div class="flame"></div>
</div>



<h1>Dadin Kutak Sveća</h1>

<p class="subtitle">
Ručno pravljene sveće ✨
</p>


<div class="notice">

🛵 Samo lično dostavljanje

</div>



<section class="products">

<div class="card">

<img src="krigla.jpg">

<h2>Krigla</h2>

<div class="price">

350 din

</div>

</div>



<div class="card">

<img src="casice.jpg">

<h2>Čašice</h2>

<div class="price">

250 din

</div>

</div>



<div class="card">

<img src="medice.jpg">

<h2>Medice</h2>

<div class="price">

150 din

</div>

</div>



<div class="card">

<img src="male.jpg">

<h2>Male</h2>

<div class="price">

100 din

</div>

</div>

</section>



<div class="socials">

<h2>Poručivanje</h2>

<a href="#">
📷 Instagram
</a>

<a href="#">
📘 Facebook
</a>

<a href="#">
🎵 TikTok
</a>

<a href="#">
💬 Poruči u inbox
</a>

</div>



<footer>

🕯️ Dadin Kutak Sveća

</footer>

</body>
</html>
