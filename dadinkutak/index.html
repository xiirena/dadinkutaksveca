<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dadin Kutak Sveća</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(180deg,#160018,#2f0a38,#140015);
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* Glow */

.glow{
position:fixed;
width:400px;
height:400px;
background:orange;
filter:blur(150px);
opacity:.15;
border-radius:50%;
animation:move 10s infinite alternate;
z-index:-2;
}

@keyframes move{
to{
transform:
translateX(300px)
translateY(200px);
}
}

/* Candle bg */

.candle{
position:fixed;
font-size:50px;
opacity:.05;
animation:rise 15s linear infinite;
}

.c1{left:10%}
.c2{left:40%}
.c3{left:75%}

@keyframes rise{

0%{
transform:translateY(100vh);
}

100%{
transform:translateY(-150px);
}

}

.languages{
position:absolute;
top:20px;
right:20px;
display:flex;
gap:10px;
}

.languages button{
border:none;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
background:#ffffff20;
color:white;
}

header{

padding:70px 20px;
text-align:center;
}

h1{

font-family:"Great Vibes";
font-size:85px;

color:#ffd28a;

text-shadow:
0 0 20px orange,
0 0 40px gold;
}

.subtitle{

margin-top:10px;
opacity:.8;
}

.delivery{

text-align:center;
margin:20px;
font-size:20px;
color:#ffd28a;
}

.products{

display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;

padding:40px;
}

.card{

width:250px;

background:#ffffff10;

padding:20px;

border-radius:25px;

transition:.3s;
}

.card:hover{

transform:translateY(-10px);

box-shadow:
0 0 30px orange;
}

.card img{

width:100%;
height:220px;

background:#333;

border-radius:20px;
object-fit:cover;
}

.price{

font-size:24px;
font-weight:bold;

color:#ffd28a;

margin-top:10px;
}

.socials{

text-align:center;
padding:50px;
}

.links{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.links a{

text-decoration:none;
color:white;

padding:15px 20px;

background:#ffffff10;

border-radius:20px;
}

footer{

padding:50px;
text-align:center;
opacity:.7;
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="candle c1">🕯️</div>
<div class="candle c2">🕯️</div>
<div class="candle c3">🕯️</div>


<div class="languages">

<button onclick="lang('sr')">RS</button>
<button onclick="lang('en')">EN</button>
<button onclick="lang('ru')">RU</button>

</div>


<header>

<h1 id="title">
Dadin Kutak Sveća
</h1>

<p class="subtitle" id="subtitle">
Ručno pravljene sveće ✨
</p>

</header>


<div class="delivery" id="delivery">

🚚 Samo lično dostavljanje

</div>



<section class="products">

<div class="card">

<img src="https://via.placeholder.com/250x220">

<h2>Krigla</h2>

<div class="price">

350 din

</div>

</div>


<div class="card">

<img src="https://via.placeholder.com/250x220">

<h2>Čašice</h2>

<div class="price">

250 din

</div>

</div>


<div class="card">

<img src="https://via.placeholder.com/250x220">

<h2>Medice</h2>

<div class="price">

150 din

</div>

</div>


<div class="card">

<img src="https://via.placeholder.com/250x220">

<h2>Male</h2>

<div class="price">

100 din

</div>

</div>

</section>



<section class="socials">

<h2>
Poručivanje
</h2>

<br>

<div class="links">

<a href="#">Instagram</a>

<a href="#">Facebook</a>

<a href="#">TikTok</a>

<a href="#">Inbox</a>

</div>

</section>


<footer>

🕯️ Dadin Kutak Sveća

</footer>


<script>

const texts={

sr:[
"Dadin Kutak Sveća",
"Ručno pravljene sveće ✨",
"🚚 Samo lično dostavljanje"
],

en:[
"Dado's Candle Corner",
"Handmade candles ✨",
"🚚 Personal delivery only"
],

ru:[
"Уголок свечей Дади",
"Свечи ручной работы ✨",
"🚚 Только личная доставка"
]

};

function lang(l){

title.innerHTML=texts[l][0];
subtitle.innerHTML=texts[l][1];
delivery.innerHTML=texts[l][2];

}

</script>

</body>
</html>
