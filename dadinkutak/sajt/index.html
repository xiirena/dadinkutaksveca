<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dadin Kutak Sveća</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:
linear-gradient(
180deg,
#120014,
#2a0935,
#140016
);

overflow-x:hidden;
color:white;
min-height:100vh;
}

/* GLOW */

.glow{
position:fixed;
width:500px;
height:500px;
background:#ffb347;
filter:blur(160px);
opacity:.2;
border-radius:50%;
animation:move 8s infinite alternate;
z-index:-3;
}

@keyframes move{

to{
transform:
translateX(300px)
translateY(150px);
}

}


/* ANIMIRANE SVECE */

.candle{
position:fixed;
bottom:0;
font-size:60px;
opacity:.08;
animation:float 12s linear infinite;
}

.c1{left:5%;}
.c2{left:30%;}
.c3{left:70%;}
.c4{left:90%;}

@keyframes float{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-120vh);
}

}


/* CVECE */

.flower{
position:fixed;
font-size:40px;
opacity:.05;
animation:spin 20s linear infinite;
}

.f1{
left:10%;
top:10%;
}

.f2{
right:10%;
bottom:20%;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}


.languages{
position:absolute;
right:20px;
top:20px;
display:flex;
gap:10px;
}

.languages button{

padding:10px 18px;
border:none;
border-radius:20px;
background:#ffffff15;
color:white;
cursor:pointer;
transition:.3s;
}

.languages button:hover{

background:#ffb347;
transform:scale(1.1);

}


header{
text-align:center;
padding:70px 20px;
}

h1{

font-family:"Great Vibes";
font-size:90px;

color:#ffd48f;

text-shadow:
0 0 20px orange,
0 0 50px gold;

animation:flicker 2s infinite;
}

@keyframes flicker{

50%{
opacity:.8;
}

}

.subtitle{

font-size:20px;
opacity:.8;
margin-top:10px;
}


/* DELIVERY */

.delivery{

text-align:center;
margin:20px;

font-size:20px;

color:#ffd48f;
}


/* CARDS */

.products{

display:flex;
justify-content:center;
flex-wrap:wrap;
gap:35px;
padding:40px;
}

.card{

background:rgba(255,255,255,.05);

width:250px;

padding:18px;

border-radius:30px;

backdrop-filter:blur(10px);

transition:.4s;
}

.card:hover{

transform:
translateY(-10px)
scale(1.03);

box-shadow:
0 0 30px orange;

}

.card img{

width:100%;
height:220px;

border-radius:20px;
object-fit:cover;

background:#333;
}

.card h2{

margin-top:15px;
font-size:28px;
}

.price{

font-size:24px;
margin-top:8px;

color:#ffd48f;
font-weight:bold;
}


/* SOCIALS */

.socials{

text-align:center;
padding:60px 20px;
}

.socials h2{

font-family:"Great Vibes";
font-size:55px;
margin-bottom:25px;
}

.links{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.links a{

text-decoration:none;
color:white;

padding:15px 25px;

background:#ffffff10;

border-radius:30px;

transition:.3s;
}

.links a:hover{

background:#ffb347;
transform:scale(1.1);
}


/* FOOTER */

footer{

text-align:center;
padding:50px;
opacity:.7;
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="candle c1">🕯️</div>
<div class="candle c2">🕯️</div>
<div class="candle c3">🕯️</div>
<div class="candle c4">🕯️</div>

<div class="flower f1">🌸</div>
<div class="flower f2">🌷</div>


<div class="languages">

<button onclick="lang('sr')">RS</button>
<button onclick="lang('en')">EN</button>
<button onclick="lang('ru')">RU</button>

</div>


<header>

<h1 id="title">
Dadin Kutak Sveća
</h1>

<p class="subtitle" id="subtitle">
Ručno pravljene sveće ✨
</p>

</header>


<div class="delivery" id="delivery">
🚚 Samo lično dostavljanje
</div>



<section class="products">

<div class="card">

<img src="krigla.jpg">

<h2>Krigla</h2>

<div class="price">
350 din
</div>

</div>


<div class="card">

<img src="casice.jpg">

<h2>Čašice</h2>

<div class="price">
250 din
</div>

</div>


<div class="card">

<img src="medice.jpg">

<h2>Medice</h2>

<div class="price">
150 din
</div>

</div>


<div class="card">

<img src="male.jpg">

<h2>Male</h2>

<div class="price">
100 din
</div>

</div>

</section>



<section class="socials">

<h2>
Poručivanje
</h2>

<div class="links">

<a href="">
📷 Instagram
</a>

<a href="">
📘 Facebook
</a>

<a href="">
🎵 TikTok
</a>

<a href="">
💌 Inbox
</a>

</div>

</section>


<footer>

🕯️ Dadin Kutak Sveća

</footer>



<script>

const texts={

sr:[
"Dadin Kutak Sveća",
"Ručno pravljene sveće ✨",
"🚚 Samo lično dostavljanje"
],

en:[
"Dado's Candle Corner",
"Handmade candles ✨",
"🚚 Personal delivery only"
],

ru:[
"Уголок свечей Дади",
"Свечи ручной работы ✨",
"🚚 Только личная доставка"
]

}


function lang(l){

document.getElementById("title").innerHTML=
texts[l][0]

document.getElementById("subtitle").innerHTML=
texts[l][1]

document.getElementById("delivery").innerHTML=
texts[l][2]

}

</script>

</body>
</html>
